name: Generate Constitution Content

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run content generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate.js

      - name: Commit generated JSON files
        run: |
          git config --global user.name "Samvidhan Bot"
          git config --global user.email "bot@samvidhan.app"
          git add public/data/
          git diff --staged --quiet || git commit -m "Generated article content"
          git push
